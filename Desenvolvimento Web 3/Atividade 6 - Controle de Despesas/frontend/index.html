<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Despesas</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <h1>Controle de Despesas</h1>

    <form id="expense-form">
      <div class="field">
        <label for="description">Descrição</label>
        <input type="text" id="description" placeholder="Ex.: Mercado" required />
      </div>

      <div class="field">
        <label for="amount">Valor (R$)</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" required />
      </div>

      <div class="field">
        <label for="date">Data</label>
        <input type="date" id="date" />
      </div>

      <button type="submit" class="btn-primary">Cadastrar Despesa</button>
    </form>

    <h2>Despesas</h2>
    <ul id="expense-list" class="list"></ul>

    <div class="total">Total: <span id="total-amount">R$ 0,00</span></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
