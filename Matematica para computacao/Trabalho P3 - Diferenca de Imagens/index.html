<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Projeto - Remoção Direita</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .canvas-container {
      display: flex;
      gap: 40px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    canvas {
      border: 2px solid #fff;
      max-width: 100%;
      height: auto;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>Projeto: Remoção de Área</h1>
<button onclick="resetImage()">Resetar</button>
<button onclick="generateDiff()">Gerar Comparação</button>
<button onclick="downloadDiff()">Baixar Diferença</button>

<div class="canvas-container">
  <div>
    <h1>Imagem Original</h1>
    <canvas id="originalCanvas" width="1801" height="1564"></canvas>
  </div>
  <div>
    <h1>Imagem Modificada</h1>
    <canvas id="editCanvas" width="1801" height="1564"></canvas>
  </div>
  <div>
    <h1>Diferença</h1>
    <canvas id="diffCanvas" width="1801" height="1564"></canvas>
  </div>
</div>




<script>
const areas = [

  {

  {
    "id": 15,
    "name": "\u00c1rea 15",
    "coords": [

      1445
    ]
  }
];
let removedAreas = [];
let comparisonLocked = false;

const originalCanvas = document.getElementById('originalCanvas');
const originalCtx = originalCanvas.getContext('2d');
const editCanvas = document.getElementById('editCanvas');
const editCtx = editCanvas.getContext('2d');
const diffCanvas = document.getElementById('diffCanvas');
const diffCtx = diffCanvas.getContext('2d');

const img = new Image();
img.src = 'original_atual.png';

img.onload = () => {
  originalCtx.drawImage(img, 0, 0);
  drawEdited();
};

function drawEdited() {
  editCtx.clearRect(0, 0, editCanvas.width, editCanvas.height);
  editCtx.drawImage(img, 0, 0);

  removedAreas.forEach(area => {
    const [x1, y1, x2, y2] = area.coords;
    editCtx.fillStyle = "white";
    editCtx.fillRect(x1, y1, x2 - x1, y2 - y1);
  });

  areas.forEach(area => {
    if (!removedAreas.some(a => a.id === area.id)) {
      const [x1, y1, x2, y2] = area.coords;
      if (hoveredArea && hoveredArea.id === area.id) {
        editCtx.fillStyle = "rgba(255, 0, 0, 0.3)";
        editCtx.fillRect(x1, y1, x2 - x1, y2 - y1);
        editCtx.strokeStyle = "red";
        editCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      }
    }
  });
}

function resetImage() {
  comparisonLocked = false;
  removedAreas = [];
  drawEdited();
  diffCtx.clearRect(0, 0, diffCanvas.width, diffCanvas.height);
}

function generateDiff() {
  comparisonLocked = true;
  if (!removedAreas.length) return;

  const originalData = originalCtx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);
  const editedData = editCtx.getImageData(0, 0, editCanvas.width, editCanvas.height);
  const diffData = diffCtx.createImageData(originalData);

  for (let i = 0; i < originalData.data.length; i += 4) {
    const r1 = originalData.data[i];
    const g1 = originalData.data[i + 1];
    const b1 = originalData.data[i + 2];

    const r2 = editedData.data[i];
    const g2 = editedData.data[i + 1];
    const b2 = editedData.data[i + 2];

    if (r1 === r2 && g1 === g2 && b1 === b2) {
      diffData.data[i + 3] = 0;
    } else {
      diffData.data[i] = 255;
      diffData.data[i + 1] = 0;
      diffData.data[i + 2] = 255;
      diffData.data[i + 3] = 255;
    }
  }

  diffCtx.putImageData(diffData, 0, 0);
}

function downloadDiff() {
  const link = document.createElement('a');
  link.download = 'diferenca_multiplas.png';
  link.href = diffCanvas.toDataURL();
  link.click();
}

let hoveredArea = null;

editCanvas.addEventListener('mousemove', (e) => {
  const rect = editCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  hoveredArea = null;
  for (const area of areas) {
    const [x1, y1, x2, y2] = area.coords;
    if (mouseX >= x1 && mouseX <= x2 && mouseY >= y1 && mouseY <= y2 &&
        !removedAreas.some(a => a.id === area.id)) {
      hoveredArea = area;
      break;
    }
  }
  drawEdited();
});

editCanvas.addEventListener('click', () => {
  if (comparisonLocked) return;
  if (hoveredArea && !removedAreas.some(a => a.id === hoveredArea.id)) {
    removedAreas.push(hoveredArea);
    drawEdited();
  }
});
</script>
</body>
</html>
